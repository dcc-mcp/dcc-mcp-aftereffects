name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-compatibility:
    name: Dependencies / ${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [floor, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install floor dependencies
        if: ${{ matrix.lane == 'floor' }}
        run: python -m pip install -e ".[dev]" "dcc-mcp-core==0.20.14"
      - name: Install latest compatible dependencies
        if: ${{ matrix.lane == 'latest' }}
        run: python -m pip install --upgrade --upgrade-strategy eager -e ".[dev]"
      - name: Validate dependency lane
        run: |
          python -m pip check
          pytest tests/test_package.py tests/test_install_hardening.py -q

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Install lifecycle contract smoke
        run: pytest tests/test_install_lifecycle.py tests/test_install_docs.py -q
      - run: pytest
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python tools/lint_skills.py
      - run: python -m build
      - run: python -m twine check dist/*
